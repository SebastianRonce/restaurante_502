{% extends 'gestion/base.html' %}

{% block content %}

<h2>Formulario Factura</h2>

<form method="POST">

    {% csrf_token %}

    {{ form.as_p }}

    <p>
        El subtotal, impuesto y total de la factura
        se calculan automáticamente según la orden seleccionada.
    </p>

    <button type="submit">
        Guardar
    </button>

</form>

<br>

<a href="{% url 'facturas' %}">
    Volver
</a>

{% endblock %}
