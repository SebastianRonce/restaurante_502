{% extends 'gestion/base.html' %}

{% block content %}

<div class="login-container">

    <div class="login-card">

        <h2>Iniciar Sesión</h2>

        {% if error %}
            <div class="error-login">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <label for="username">
                Usuario
            </label>

            <input type="text"
                   id="username"
                   name="username"
                   placeholder="Ingrese su usuario"
                   required>

            <label for="password">
                Contraseña
            </label>

            <input type="password"
                   id="password"
                   name="password"
                   placeholder="Ingrese su contraseña"
                   required>

            <button type="submit">
                Ingresar
            </button>

        </form>

        <p>
            ¿No tienes cuenta?
            <a href="{% url 'registro' %}">
                Registrarse
            </a>
        </p>

    </div>

</div>

{% endblock %}
