{% extends 'gestion/base.html' %}

{% block content %}

<h2>Mesas</h2>

<a href="{% url 'crear_mesa' %}">
    <button>Nueva Mesa</button>
</a>

<br><br>

<table border="1" cellpadding="10">

    <tr>
        <th>ID</th>
        <th>Número</th>
        <th>Capacidad</th>
        <th>Estado</th>
        <th>Acciones</th>
    </tr>

    {% for mesa in mesas %}
    <tr>

        <td>{{ mesa.id }}</td>
        <td>{{ mesa.numero_mesa }}</td>
        <td>{{ mesa.capacidad }}</td>
        <td>{{ mesa.estado_mesa }}</td>

        <td>

            <a href="{% url 'editar_mesa' mesa.id %}">
                Editar
            </a>

            |

            <a href="{% url 'eliminar_mesa' mesa.id %}"
               onclick="return confirm('¿Seguro que deseas eliminar esta mesa?')">
                Eliminar
            </a>

        </td>

    </tr>
    {% endfor %}

</table>

{% endblock %}
