{% extends 'gestion/base.html' %}

{% block content %}

<div class="seccion-header">
    <h2>👤 {% if form.instance.pk %}Editar Cliente{% else %}Nuevo Cliente{% endif %}</h2>
    <span class="seccion-linea"></span>
</div>

<div class="form-card">

    <form method="POST">
        {% csrf_token %}

        {% for field in form %}
        <div class="form-grupo">
            <label for="{{ field.id_for_label }}">{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}
                <span style="color:#C62828;font-size:0.78rem;margin-top:4px;display:block;">{{ field.errors|join:", " }}</span>
            {% endif %}
        </div>
        {% endfor %}

        <div style="display:flex;gap:12px;margin-top:8px;">
            <button type="submit" class="btn btn-dorado">💾 Guardar</button>
            <a href="{% url 'clientes' %}" class="btn btn-secundario">← Volver</a>
        </div>

    </form>

</div>

{% endblock %}
